<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0ea5e9"/>

  <!-- Payment/Document Icon -->
  <g transform="translate(96, 96)">
    <!-- Document/Invoice -->
    <rect x="32" y="0" width="256" height="320" rx="16" fill="white" opacity="0.95"/>

    <!-- Document Lines (representing invoice lines) -->
    <rect x="64" y="48" width="192" height="16" rx="8" fill="#0f172a" opacity="0.8"/>
    <rect x="64" y="88" width="160" height="16" rx="8" fill="#0f172a" opacity="0.6"/>
    <rect x="64" y="128" width="176" height="16" rx="8" fill="#0f172a" opacity="0.6"/>

    <!-- Money/Payment Symbol (Dollar sign or graph) -->
    <g transform="translate(80, 180)">
      <!-- Bar chart representing analysis -->
      <rect x="0" y="80" width="32" height="60" rx="4" fill="#0ea5e9"/>
      <rect x="48" y="40" width="32" height="100" rx="4" fill="#0ea5e9"/>
      <rect x="96" y="60" width="32" height="80" rx="4" fill="#0ea5e9"/>
      <rect x="144" y="20" width="32" height="120" rx="4" fill="#0ea5e9"/>
    </g>

    <!-- Checkmark (Analysis/Verification) -->
    <path d="M 240 40 L 260 60 L 280 20" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
